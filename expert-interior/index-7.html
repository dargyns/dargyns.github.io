<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expert Interior — дизайн интерьеров в Екатеринбурге</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Три подачи: editorial (стройка, архитектура, интерьер), soft (красота, здоровье), bold (авто, еда, спорт, услуги) */
:root{--paper:#f3eee6;--paper2:#e8e1d5;--card:#fbf8f3;--ink:#1c1d1b;--mute:#6f6a62;--line:rgba(28,29,27,.12);--acc:#a8784a;--acc2:#c9a27a;--deep:#1f2120;--night:#121a20;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,sans-serif;--head:var(--serif);--hw:500;--r:2px}
:root.soft{--paper:#f6f0ec;--paper2:#efe4de;--card:#fffaf7;--ink:#2a2224;--mute:#82746f;--acc:#b0786c;--acc2:#e0b4a8;--deep:#2c2326;--night:#241c1e;--r:22px}
:root.bold{--paper:#f1f1ef;--paper2:#e4e4e1;--card:#fff;--ink:#121314;--mute:#6b6e72;--acc:#e8572a;--acc2:#ff9a6f;--deep:#151618;--night:#0e0f11;--head:"Unbounded",system-ui,sans-serif;--hw:700;--r:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:clip;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);font-weight:var(--hw);line-height:1.04;letter-spacing:-.01em;margin:0;text-wrap:balance}
:root.bold h1,:root.bold h2{letter-spacing:-.03em;line-height:1}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
.eb{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:var(--r);background:var(--ink);color:var(--paper);font-weight:600;font-size:15px;border:1px solid var(--ink);transition:transform .25s,background .25s;cursor:pointer}
.btn:hover{transform:translateY(-1px)}
.btn.lt{background:#fff;color:#151515;border-color:#fff}
.btn.gh{background:transparent;color:inherit;border-color:currentColor}
.btn.ac{background:var(--acc);border-color:var(--acc);color:#fff}
.sec{padding-block:clamp(76px,10vw,140px)}
.h2{font-size:clamp(38px,5.4vw,72px)}
:root.bold .h2{font-size:clamp(32px,4.6vw,60px)}
.lead{font-size:clamp(17px,1.5vw,19px);color:var(--mute);max-width:52ch;margin:0}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:44px;flex-wrap:wrap}

.top{position:fixed;inset:0 0 auto;z-index:50;color:#fff;transition:background .35s,color .35s;border-bottom:1px solid transparent}
.top .in{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top.solid{background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);border-color:var(--line)}
.brand{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:14px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:flex;gap:26px;font-size:14px}.menu a{opacity:.8}.menu a:hover{opacity:1}
.tr{display:flex;align-items:center;gap:16px}.tr .ph{font-weight:600}
.tr .btn{min-height:42px;padding:0 18px;font-size:14px}
.top:not(.solid) .tr .btn{background:#fff;color:#151515;border-color:#fff}

/* первый экран: фото сменяются при прокрутке */
.hero{position:relative;background:var(--night);color:#fff}
.hero.multi{height:240vh}
.hero.multi.two{height:190vh}
.hero .pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.hero .ph{position:absolute;inset:0;background-size:cover;background-position:50% 55%;opacity:0;transform:scale(1.08);transition:opacity .9s ease,transform 6s ease}
.hero .ph.on{opacity:1;transform:scale(1)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.7),rgba(10,10,10,.25) 55%,rgba(10,10,10,0) 75%),linear-gradient(0deg,rgba(10,10,10,.72),rgba(10,10,10,0) 45%)}
.hero.nophoto .pin{background:radial-gradient(90% 70% at 80% 20%,color-mix(in srgb,var(--acc) 35%,transparent),transparent 60%),var(--night)}
.hero.nophoto .big{position:absolute;right:-2vw;top:14vh;font-family:var(--head);font-size:min(26vw,360px);line-height:.8;opacity:.07;white-space:nowrap;pointer-events:none}
.hero .copy{position:absolute;left:max(20px,calc((100vw - 1200px)/2 + 20px));right:20px;bottom:130px;max-width:640px;z-index:2}
.hero h1{font-size:clamp(42px,5.6vw,84px);margin:14px 0 18px}
:root.bold .hero h1{font-size:clamp(34px,4.6vw,66px)}
.hero h1 em{font-style:italic;color:var(--acc2)}
.hero .copy p{font-size:18px;opacity:.88;max-width:46ch;margin:0 0 28px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero .cap{position:absolute;right:max(20px,calc((100vw - 1200px)/2 + 20px));bottom:140px;z-index:2;text-align:right;font-size:13px;opacity:.8;max-width:240px}
.hero .cap b{display:block;font-family:var(--head);font-weight:var(--hw);font-size:22px;opacity:1}
.dots{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}.dots i{width:22px;height:2px;background:rgba(255,255,255,.35)}.dots i.on{background:#fff}
.facts{position:absolute;left:0;right:0;bottom:0;z-index:2;border-top:1px solid rgba(255,255,255,.18)}
.facts .in{max-width:1200px;margin:0 auto;padding:18px 20px;display:flex;gap:clamp(20px,5vw,70px);flex-wrap:wrap}
.facts b{display:block;font-family:var(--head);font-weight:var(--hw);font-size:30px;line-height:1}
:root.bold .facts b{font-size:24px}
.facts span{font-size:12.5px;opacity:.75}

/* манифест */
.man{font-family:var(--head);font-weight:var(--hw);font-size:clamp(28px,3.6vw,50px);line-height:1.18;max-width:24ch;margin:0}
:root.bold .man{font-size:clamp(24px,3vw,40px)}
.man em{font-style:italic;color:var(--acc)}
.mangrid{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(30px,6vw,90px);align-items:end}

/* услуги списком, а не карточками */
.svc{border-top:1px solid var(--line)}
.sv{display:grid;grid-template-columns:60px 1fr auto;gap:20px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--line);transition:padding .3s}
.sv:hover{padding-left:10px}
.sv i{font-style:normal;font-size:12px;color:var(--acc);letter-spacing:.12em}
.sv h3{font-size:clamp(24px,2.4vw,32px)}
:root.bold .sv h3{font-size:clamp(18px,1.8vw,22px)}
.sv p{margin:6px 0 0;color:var(--mute);max-width:60ch}
.sv b{white-space:nowrap;font-weight:600;font-size:17px}

/* работы */
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.gal button{position:relative;border:0;padding:0;overflow:hidden;cursor:zoom-in;background:#ccc;border-radius:var(--r)}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.gal button:hover img{transform:scale(1.04)}
.gal button span{position:absolute;left:16px;bottom:14px;right:16px;color:#fff;font-size:13px;text-align:left;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.g0{grid-column:span 4;aspect-ratio:16/10}.g1{grid-column:span 2}.g2,.g3,.g4{grid-column:span 2;aspect-ratio:4/5}.g5{grid-column:span 6;aspect-ratio:21/8}
.g6{grid-column:span 3;aspect-ratio:4/3}
.g1 img{position:absolute;inset:0}
.lb{position:fixed;inset:0;z-index:80;background:rgba(10,10,10,.92);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}.lb.open{display:flex}.lb img{max-height:90vh}

/* почему мы */
.adv{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}
.ad{padding:26px 24px 10px 0;border-right:1px solid var(--line);margin-right:24px}
.ad:last-child{border-right:0}
.ad b{display:block;font-family:var(--head);font-weight:var(--hw);font-size:clamp(22px,2vw,28px);line-height:1.15;margin-bottom:10px}
:root.bold .ad b{font-size:18px}
.ad p{margin:0;color:var(--mute)}

/* этапы */
.dark{background:var(--deep);color:var(--paper)}
.dark .lead{color:rgba(255,255,255,.65)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;border-top:1px solid rgba(255,255,255,.2);padding:22px 20px 0 0;font-size:17px}
.steps li::before{content:counter(s,decimal-leading-zero);display:block;font-family:var(--head);font-weight:var(--hw);font-size:44px;color:var(--acc2);line-height:1;margin-bottom:14px}
:root.bold .steps li::before{font-size:32px}

/* вопросы */
.two{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(30px,6vw,90px)}
.faq details{border-top:1px solid var(--line);padding:22px 0}.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;font-family:var(--head);font-weight:var(--hw);font-size:clamp(22px,2.2vw,28px);line-height:1.2}
:root.bold .faq summary{font-size:18px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--sans);font-weight:300;font-size:26px;color:var(--acc);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{margin:12px 0 0;color:var(--mute);max-width:70ch}

/* контакты */
.con{position:relative;background:var(--night);color:var(--paper);overflow:hidden}
.con .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.2}
.cgrid{position:relative;display:grid;grid-template-columns:1.2fr 1fr;gap:50px;align-items:end}
.con h2{font-size:clamp(42px,6vw,86px)}
:root.bold .con h2{font-size:clamp(32px,4.6vw,60px)}
.cl{border-top:1px solid rgba(255,255,255,.18)}
.cl div{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.cl span{color:rgba(255,255,255,.6)}
.foot{background:#0b0f12;color:rgba(255,255,255,.5);font-size:13px;padding:22px 0 calc(88px + env(safe-area-inset-bottom,0px))}
.foot .in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sticky{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;gap:8px}
.sticky .btn{flex:1;min-height:50px}

@media (max-width:960px){
  .menu,.tr .ph,.tr .btn{display:none}
  .hero .copy{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .hero .copy p{font-size:16px}
  .hero .cap,.facts{display:none}
  .hero .shade{background:linear-gradient(0deg,rgba(10,10,10,.85),rgba(10,10,10,.15) 55%,rgba(10,10,10,.3))}
  .mangrid,.two,.cgrid{grid-template-columns:1fr}
  .sv{grid-template-columns:1fr;gap:4px}.sv i{display:none}
  .gal{grid-template-columns:1fr 1fr}
  .g0,.g5{grid-column:span 2;aspect-ratio:4/3}.g1,.g2,.g3,.g4,.g6{grid-column:span 1;aspect-ratio:4/5}
  .adv{grid-template-columns:1fr 1fr}.ad{margin-right:0;padding-right:16px;border-right:0;border-bottom:1px solid var(--line)}
  .steps{grid-template-columns:1fr 1fr;gap:26px 16px}
  .sticky{display:flex}
}
@media (max-width:520px){.hero h1{font-size:38px}:root.bold .hero h1{font-size:30px}.adv,.steps{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.hero .ph{transition:none}}
</style>

${facts.length?`<div class="facts"><div class="in">${facts.map(f=>`<div><b>${e(f.value)}</b><span>${e(f.label)}</span></div>`).join('')}</div></div>`:''}
</div></section>`;
if(D.manifest||D.about) h+=`<section class="sec wrap"><div class="mangrid"><p class="man rv">${e(D.manifest||D.about).replace(/\*(.+?)\*/g,'<em>$1</em>')}</p>${D.manifest&&D.about?`<p class="lead rv">${e(D.about)}</p>`:''}</div></section>`;
const sv=D.services||[];
if(sv.length) h+=`<section class="sec wrap" id="services" style="padding-top:0"><div class="head"><div><div class="eb">Услуги и цены</div><h2 class="h2 rv" style="margin-top:12px">${e(D.services_title||'Чем мы занимаемся')}</h2></div>${D.services_note?`<p class="lead rv">${e(D.services_note)}</p>`:''}</div>
<div class="svc">${sv.map((s,i)=>`<div class="sv rv"><i>${String(i+1).padStart(2,'0')}</i><div><h3>${e(s.name)}</h3>${s.desc?`<p>${e(s.desc)}</p>`:''}</div>${s.price?`<b>${e(s.price)}</b>`:'<b></b>'}</div>`).join('')}</div></section>`;
if(P.length>1){const g=P.slice(0,6);h+=`<section class="sec wrap" id="works" style="padding-top:0"><div class="head"><div><div class="eb">Работы</div><h2 class="h2 rv" style="margin-top:12px">${e(D.works_title||'Как это выглядит')}</h2></div></div>
<div class="gal">${g.map((p,i)=>`<button class="${({2:['g0','g1'],3:['g0','g1','g5'],4:['g0','g1','g6','g6'],5:['g0','g1','g6','g6','g5']}[g.length]||['g0','g1','g2','g3','g4','g5'])[i]} rv" type="button"><img src="${p}" alt="">${caps[i]?`<span>${e(caps[i])}</span>`:''}</button>`).join('')}</div></section>`;}
const adv=D.advantages||[];
if(adv.length) h+=`<section class="sec wrap" style="padding-top:0"><div class="head"><div><div class="eb">Почему мы</div><h2 class="h2 rv" style="margin-top:12px">${e(D.advantages_title||'Что важно для нас')}</h2></div></div><div class="adv">${adv.slice(0,4).map(a=>`<div class="ad rv"><b>${e(a.title)}</b><p>${e(a.text)}</p></div>`).join('')}</div></section>`;
if((D.steps||[]).length) h+=`<section class="sec dark" id="steps"><div class="wrap"><div class="head"><div><div class="eb" style="color:var(--acc2)">Как работаем</div><h2 class="h2 rv" style="margin-top:12px">${e(D.steps_title||'От заявки до результата')}</h2></div></div><ol class="steps">${D.steps.slice(0,4).map(s=>`<li class="rv">${e(s)}</li>`).join('')}</ol></div></section>`;
if((D.faq||[]).length) h+=`<section class="sec wrap" id="faq"><div class="two"><div><div class="eb">Вопросы</div><h2 class="h2 rv" style="margin-top:12px">Частые вопросы</h2></div><div class="faq rv">${D.faq.map(f=>`<details><summary>${e(f.q)}</summary><p>${e(f.a)}</p></details>`).join('')}</div></div></section>`;
h+=`<section class="sec con" id="contacts">${P[1]||P[0]?`<div class="bg" style="background-image:url('${P[1]||P[0]}')"></div>`:''}<div class="wrap cgrid"><div><div class="eb" style="color:var(--acc2)">Контакты</div><h2 style="margin-top:12px">${e(D.contact_title||'Свяжитесь с нами')}</h2>
<div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:28px">${wa?`<a class="btn lt" href="${e(wa)}" target="_blank" rel="noopener">Написать в WhatsApp</a>`:''}${tg?`<a class="btn gh" href="${e(tg)}" target="_blank" rel="noopener">Telegram</a>`:''}${tel?`<a class="btn gh" href="tel:+${tel}">Позвонить</a>`:''}</div></div>
<div class="cl">${phones.length?`<div><span>Телефон</span><a href="tel:+${tel}">${phones.map(fmt).map(e).join('<br>')}</a></div>`:''}${L.address?`<div><span>Адрес</span><b style="font-weight:500;text-align:right">${e(L.address)}</b></div>`:''}${L.city_name?`<div><span>Город</span><b style="font-weight:500">${e(L.city_name)}</b></div>`:''}${L.rating?`<div><span>2ГИС</span><b style="font-weight:500">★ ${String(L.rating).replace('.',',')}${L.reviews?` · ${L.reviews} отзывов`:''}</b></div>`:''}</div></div></section>`;
document.getElementById('app').innerHTML=h;
document.body.insertAdjacentHTML('beforeend',`<footer class="foot"><div class="wrap in"><span>© ${e(brand)}</span><span>Демо-версия сайта</span></div></footer>`);
document.getElementById('sticky').innerHTML=`<a class="btn ac" href="${e(ctaHref)}"${ext(ctaHref)}>${e(cta)}</a>${tel?`<a class="btn lt" style="flex:0 0 auto;padding:0 18px" href="tel:+${tel}">Звонок</a>`:''}`;
// первый экран
const hero=document.getElementById('hero'),top=document.getElementById('top'),phs=[...hero.querySelectorAll('.ph')],dots=[...hero.querySelectorAll('.dots i')],capT=document.getElementById('capT');
let cur=0;
function onScroll(){const r=hero.getBoundingClientRect();top.classList.toggle('solid',r.bottom<=80);
  if(phs.length>1){const p=Math.min(1,Math.max(0,-r.top/(hero.offsetHeight-innerHeight)));const i=Math.min(phs.length-1,Math.floor(p*phs.length*.999));
    if(i!==cur){phs[cur].classList.remove('on');phs[i].classList.add('on');dots.forEach((d,k)=>d.classList.toggle('on',k===i));if(capT)capT.textContent=caps[i]||'';cur=i;}}}
addEventListener('scroll',onScroll,{passive:true});onScroll();
// увеличение фото
const lb=document.getElementById('lb'),li=lb.querySelector('img');
document.querySelectorAll('.gal button').forEach(b=>b.onclick=()=>{li.src=b.querySelector('img').src;lb.classList.add('open');});lb.onclick=()=>lb.classList.remove('open');
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
})();
</script>
</body>
</html>
